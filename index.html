<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>科目一通关笔记</title>
<meta name="description" content="驾照科目一考点大纲、高频数字速记和经典真题练习，手机电脑都能用，离线可看。">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="科目一">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="logo"><span class="mark">驾</span>科目一通关笔记</div>
      <div class="top-stat" id="topStat"></div>
      <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">◐</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="outline" aria-selected="true"><span class="ti">📖</span>考点</button>
      <button role="tab" data-view="numbers" aria-selected="false"><span class="ti">🔢</span>速记</button>
      <button role="tab" data-view="quiz" aria-selected="false"><span class="ti">✍️</span>刷题</button>
      <button role="tab" data-view="wrong" aria-selected="false"><span class="ti">📕</span>错题<span id="wrongBadge"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-outline">
    <h2 class="vh">考点大纲</h2>
    <p class="lead">8 章、按考试分值排。红标 <span class="tag h2">必考</span> 先背，黄标 <span class="tag h1">常考</span> 其次。每条下面的"记"是一句话抓手，背熟它就够用。</p>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="搜考点，比如：高速 / 停车 / 12分 / 雾" autocomplete="off">
      <button class="chip" id="onlyHot" aria-pressed="false">只看必考</button>
      <button class="chip" id="hideMastered" aria-pressed="false">隐藏已掌握</button>
    </div>
    <div class="toc" id="toc"></div>
    <div id="outline-box"></div>
  </section>

  <section class="view" id="view-numbers" hidden>
    <h2 class="vh">数字速记</h2>
    <p class="lead">科目一四成以上的题考的是数字。打开"遮住答案"后点一下才显示，用来自测。</p>
    <div class="toolbar"><button class="chip" id="hideAns" aria-pressed="false">遮住答案</button></div>
    <div id="numbers-box"></div>
  </section>

  <section class="view" id="view-quiz" hidden>
    <div id="quiz-box"></div>
  </section>

  <section class="view" id="view-wrong" hidden>
    <div id="wrong-box"></div>
  </section>

  <footer class="foot">
    内容依据《道路交通安全法》《道路交通安全法实施条例》《机动车驾驶证申领和使用规定》（公安部令第 162 号）《道路交通安全违法行为记分管理办法》（公安部令第 163 号，2022-04-01 起施行）整理；题目按公开题库常见题型改写，供复习使用，以官方考试系统为准。<br>
    学习进度和错题只存在这台设备的浏览器里。
  </footer>
</main>

<script src="assets/data.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
